repos:
-   repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    - id: black
      language_version: python3.11
-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
    - id: flake8
-   repo: local
    hooks:
    - id: mypy
      name: mypy
      entry: mypy loqs docs_scripts tests
      language: system
      pass_filenames: false
      types: [python]