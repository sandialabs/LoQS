# Read the Docs configuration file for LoQS documentation.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Disable building PDF/ePub formats since we use MkDocs
formats: []

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    install:
      # Upgrade pip and install the package
      - pip install --upgrade pip
      - pip install .[docs]
    build:
      html:
        # Run our custom two-pass documentation build script, writing output directly to Read the Docs' html output directory
        - python docs/serve.py --build-only --out $READTHEDOCS_OUTPUT/html --clean
