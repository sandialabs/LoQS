site_name: LoQS Documentation

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart Guide: markdown/getting-started.md
      - High-level Overview: markdown/overview.md
      - Example Workflow: notebooks/workflow.md
  - Short Course:
      - First Steps with LoQS: notebooks/shortcourse-firststeps.md
      - Adding (Global) Model Noise: notebooks/shortcourse-generalnoise.md
      - Instruction-specific Noise & Error Injection: notebooks/shortcourse-targetednoise.md
  - Tutorials:
      - Build Instruction: notebooks/buildinstruction.md
      - Build QECCode: notebooks/buildqeccode.md
  - Examples:
      - Run LoGST: notebooks/runlogst.md
      - FT Tests: notebooks/fttests.md
      - Time-Dependent Model: notebooks/timedepmodel.md
  - Reference:
      - Dev Guide: markdown/devguide.md
      - API Documentation: /reference
      - Bibliography: markdown/references.md

theme:
  name: material
  logo: logo_icon.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - footnotes
  - toc:
      permalink: true
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - include-markdown
  - bibtex:
      bib_file: docs/references.bib
      csl_file: docs/american-physical-society-et-al.csl
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: docs_scripts.main_hooks:on_page_markdown
        on_nav: docs_scripts.main_hooks:on_nav