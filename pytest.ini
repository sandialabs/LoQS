[pytest]
addopts = --doctest-modules --ignore=src --ignore=tests/performance --ignore=tests/backends/fixtures/generate_reps_fixtures.py --ignore=tests/backends/model/fixtures/generate_model_fixtures.py -m "not slow"
markers =
    slow: exhaustive/expensive tests (e.g. multi-location fault-tolerance sweeps) skipped by default; run explicitly with `-m slow` or `-m ""`.