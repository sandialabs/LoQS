name: Multiple related bugs
description: Report several related bugs in one issue, with a checklist and one section per bug.
body:
  - type: markdown
    attributes:
      value: |
        Use this form to group related bugs, e.g. several small bugs found in the same area or during the same piece of work. For a single bug or a feature request, use the other form.
        Please search the [existing issues](https://github.com/sandialabs/LoQS/issues) first. This includes closed issues in open [milestones](https://github.com/sandialabs/LoQS/milestones), i.e. fixed but not yet released.

        A good title names the part of LoQS it affects, then a short summary, e.g. `Serialization: ...` or `Tools: ...`.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: For the issue as a whole. Defaults to Low. Adjust it as you see fit; maintainers may change it during triage.
      options:
        - Low
        - Medium
        - High
      default: 0
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      description: Your best guess at the size of all the fixes together. Defaults to Low; adjust it as you see fit.
      options:
        - Low
        - Medium
        - High
      default: 0
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: |
        The shared context, such as how these bugs were found and how they're related. Link related issues or PRs inline where they matter, e.g. `[#123](https://github.com/sandialabs/LoQS/issues/123)` (use `/pull/123` for a PR).
    validations:
      required: true

  - type: textarea
    id: bugs
    attributes:
      label: Bugs
      description: |
        Edit the skeleton below: one checklist line per bug, then one section per bug. Add or delete sections as needed, and collect small bugs that fail loudly into the final "Minor bugs" list. An MWE is code that fails today and should pass once it's fixed, with the error or wrong output as a comment. Drag and drop a notebook (`.ipynb`) or script into a section to attach it.
      value: |
        - [ ] Bug 1: [short label]
        - [ ] Bug 2: [short label]
        - [ ] Minor bugs

        ---
        ### Bug 1: [one-line symptom]

        #### Problem
        What goes wrong or is missing, and what you expected instead.

        #### MWE
        ```python
        import loqs
        ...
        # ValueError: ...
        ```

        #### Fix
        A proposed fix, if you have one, with any real caveats.

        ---
        ### Bug 2: [one-line symptom]

        #### Problem

        #### MWE

        #### Fix

        ---
        ### Minor bugs
        - ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The versions involved.
      placeholder: |
        - LoQS version or commit: [e.g. 1.3.1, or 84053ba]
        - Python version: [e.g. 3.12]
        - OS: [e.g. macOS 15, Ubuntu 24.04]
    validations:
      required: false
