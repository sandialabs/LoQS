# Runs the surface codepack's validation (validation/README.md). The surgery
# CNOT's cases over 32 qubits run only on a manual dispatch with `big` set.

name: surface validation

on:
  push:
    branches: ['**']
    paths:
      - 'loqs/codepacks/codepack_surf17_tomita2014.py'
      - 'loqs/codepacks/codepack_surf17_multipatch.py'
      - 'loqs/codepacks/codepack_surf17_surgery.py'
      - 'loqs/codepacks/generator/**'
      - 'validation/**'
      - '.github/workflows/validation-surface.yml'
      - '.github/workflows/reusable-validation.yml'
  pull_request:
    paths:
      - 'loqs/codepacks/codepack_surf17_tomita2014.py'
      - 'loqs/codepacks/codepack_surf17_multipatch.py'
      - 'loqs/codepacks/codepack_surf17_surgery.py'
      - 'loqs/codepacks/generator/**'
      - 'validation/**'
      - '.github/workflows/validation-surface.yml'
      - '.github/workflows/reusable-validation.yml'
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC (default branch only)
  workflow_dispatch:
    inputs:
      big:
        description: Also run the surgery CNOT's cases over 32 qubits
        type: boolean
        default: false

jobs:
  validate:
    uses: ./.github/workflows/reusable-validation.yml
    with:
      codepack: surface
      big: ${{ github.event_name == 'workflow_dispatch' && inputs.big }}
