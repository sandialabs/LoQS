# Runs the trivial_counter codepack's validation and the harness self-tests
# (validation/README.md).

name: trivial_counter validation

on:
  push:
    branches: ['**']
    paths:
      - 'loqs/codepacks/base.py'
      - 'loqs/codepacks/trivial_counter/**'
      - 'loqs/codepacks/codepack_trivial_counter.py'
      - 'loqs/codepacks/generator/**'
      - 'validation/**'
      - '.github/workflows/validation-trivial_counter.yml'
      - '.github/workflows/reusable-validation.yml'
  pull_request:
    paths:
      - 'loqs/codepacks/base.py'
      - 'loqs/codepacks/trivial_counter/**'
      - 'loqs/codepacks/codepack_trivial_counter.py'
      - 'loqs/codepacks/generator/**'
      - 'validation/**'
      - '.github/workflows/validation-trivial_counter.yml'
      - '.github/workflows/reusable-validation.yml'
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC (default branch only)
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/reusable-validation.yml
    with:
      codepack: trivial_counter
      self_tests: true
