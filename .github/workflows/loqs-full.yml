# The full test suite: every non-draft PR into main or a bugfix-release-*
# branch, and every push to main. Nothing else triggers this workflow, so a
# commit it doesn't apply to gets no all-tests-passed check at all (a
# skipped one would count as passed). Other pushes get loqs-minimal.yml.

name: LoQS Full Tests + Docs

on:
  push:
    branches: [main, 'bugfix-release-*']
  pull_request:
    # Keep in step with check-pr-status in loqs-minimal.yml.
    branches: [main, 'bugfix-release-*']
    types: [opened, reopened]

jobs:
  # GitHub can't filter draft PRs in the trigger, so each job skips itself
  # on one.
  full-unit-tests:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        loqs-optional: ["all", "test"] #Test is no backends/parallel for minimal install testing
    uses: ./.github/workflows/reusable-loqs.yml
    name: Run complete LoQS tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      loqs-optional: ${{ matrix.loqs-optional }}

  notebook-tests:
    # Executes every tutorial notebook under docs/notebooks/*.md so that
    # API drift in a tutorial's own example code (as opposed to the
    # library's unit tests) gets caught before merge instead of shipping
    # silently.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # No loqs-optional dimension (unlike full-unit-tests): the
        # notebooks exercise optional backends directly, so only the
        # "all" install makes sense here.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install loqs[all]
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all]"

    - name: Execute notebooks
      run: python docs/run_notebooks.py --output-dir notebook-output

    - name: Upload executed notebooks (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: notebook-outputs-${{ matrix.os }}-${{ matrix.python-version }}
        path: notebook-output

  # Tests of the helper scripts under .github/scripts (Ubuntu only: they
  # test no loqs code).
  ci-script-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: python -m pip install pytest

    - run: python -m pytest .github/scripts/tests

  # This is just so we can have a check for ALL matrix tests passing on PRs.
  # always() makes it fail, not skip, when a needed job fails or is cancelled.
  all-tests-passed:
    # On a draft PR this job is skipped, and GitHub lists a skipped job
    # under the raw text of this expression, never as all-tests-passed: a
    # skipped check under the required name would count as passed.
    name: ${{ github.event.pull_request.draft && 'skipped on drafts' || 'all-tests-passed' }}
    runs-on: ubuntu-latest
    needs: [full-unit-tests, notebook-tests, ci-script-tests]
    if: ${{ always() && !github.event.pull_request.draft }}
    steps:
      - name: Check matrix results
        env:
          FULL: ${{ needs.full-unit-tests.result }}
          NOTEBOOKS: ${{ needs.notebook-tests.result }}
          SCRIPTS: ${{ needs.ci-script-tests.result }}
        run: |
          echo "full-unit-tests: $FULL"
          echo "notebook-tests: $NOTEBOOKS"
          echo "ci-script-tests: $SCRIPTS"
          if [ "$FULL" == "success" ] && [ "$NOTEBOOKS" == "success" ] && [ "$SCRIPTS" == "success" ]; then exit 0; else exit 1; fi

  # Build docs if the full unit tests ran and succeeded
  docs:
    runs-on: ubuntu-latest
    needs: full-unit-tests
    if: ${{ always() && needs.full-unit-tests.result == 'success' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build documentation
      run: |
        python docs/serve.py --build-only --out site

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: book-html
        path: site
