# This workflow runs a full test suite on the LoQS package

name: LoQS Tests + Docs

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  workflow_dispatch: # Allow manual running from GitHub

jobs:
  check-pr-status:
    # Only meaningful for push events on non-main branches -- this is what
    # minimal-unit-tests below needs to decide whether to skip itself, since
    # a push to a branch with an open, non-draft PR against main or a
    # bugfix-release-* branch will also trigger full-unit-tests (via the
    # pull_request event) for the same commit, making the minimal run
    # redundant.
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has-open-pr: ${{ steps.check.outputs.has-open-pr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # If the lookup itself fails for any reason (API hiccup, rate
          # limit, etc.), default to "no open PR" so minimal-unit-tests
          # still runs -- failing toward more coverage, not less.
          COUNT=$(gh pr list --repo "$REPO" \
                    --head "$BRANCH" \
                    --state open \
                    --json isDraft,baseRefName \
                    --jq '[.[] | select(.isDraft == false and (.baseRefName == "main" or (.baseRefName | startswith("bugfix-release-"))))] | length') || COUNT=0
          echo "has-open-pr=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  minimal-unit-tests:
    needs: check-pr-status
    # Run only on feature branches, and only if there isn't already an open,
    # non-draft PR against main or a bugfix-release-* branch that will run
    # the full matrix for this same commit via the pull_request event (see
    # check-pr-status above).
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref != 'refs/heads/main' &&
        needs.check-pr-status.outputs.has-open-pr != 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # No Mac for speed
        python-version: ['3.12'] # stim 1.15 only has 3.12 Windows wheels, pymatching 2.3.1 only has 3.13 Windows wheels
        loqs-optional: ["all"]
    uses: ./.github/workflows/reusable-loqs.yml
    name: Run minimal LoQS tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      loqs-optional: ${{ matrix.loqs-optional }}
    
  full-unit-tests:
    # Run only on non-draft PRs into main or a bugfix-release-* branch, or
    # pushes into main
    if: >-
      ${{
        (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'bugfix-release-')) && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        loqs-optional: ["all", "test"] #Test is no backends/parallel for minimal install testing
    uses: ./.github/workflows/reusable-loqs.yml
    name: Run complete LoQS tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      loqs-optional: ${{ matrix.loqs-optional }}
  
  notebook-tests:
    # Executes every tutorial notebook under docs/notebooks/*.md so that
    # API drift in a tutorial's own example code (as opposed to the
    # library's unit tests) gets caught before merge instead of shipping
    # silently. Same gate as full-unit-tests: non-draft PRs into main or a
    # bugfix-release-* branch, or pushes to main.
    if: >-
      ${{
        (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'bugfix-release-')) && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # No loqs-optional dimension (unlike full-unit-tests): the
        # notebooks exercise optional backends directly, so only the
        # "all" install makes sense here.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install loqs[all]
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all]"

    - name: Execute notebooks
      run: python docs/run_notebooks.py --output-dir notebook-output

    - name: Upload executed notebooks (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: notebook-outputs-${{ matrix.os }}-${{ matrix.python-version }}
        path: notebook-output

  # Tests of the helper scripts under .github/scripts (Ubuntu only: they
  # test no loqs code).
  ci-script-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: python -m pip install pytest

    - run: python -m pytest .github/scripts/tests

  # This is just so we can have a check for ALL matrix tests passing on PRs.
  # always() makes it fail, not skip, when a needed job fails or is cancelled.
  all-tests-passed:
    # The condition must stay the same as the `if:` below (without always()):
    # a skipped job under the required name would count as passed.
    name: >-
      ${{
        (
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'bugfix-release-')) && github.event.pull_request.draft == false) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        ) && 'all-tests-passed' || 'all-tests-passed (skipped)'
      }}
    runs-on: ubuntu-latest
    needs: [full-unit-tests, notebook-tests, ci-script-tests]
    if: >-
      ${{
        always() && (
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'bugfix-release-')) && github.event.pull_request.draft == false) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        )
      }}
    steps:
      - name: Check matrix results
        env:
          FULL: ${{ needs.full-unit-tests.result }}
          NOTEBOOKS: ${{ needs.notebook-tests.result }}
          SCRIPTS: ${{ needs.ci-script-tests.result }}
        run: |
          echo "full-unit-tests: $FULL"
          echo "notebook-tests: $NOTEBOOKS"
          echo "ci-script-tests: $SCRIPTS"
          if [ "$FULL" == "success" ] && [ "$NOTEBOOKS" == "success" ] && [ "$SCRIPTS" == "success" ]; then exit 0; else exit 1; fi
  
  # Build docs if either minimal or full unit tests ran and succeeded
  docs:
    runs-on: ubuntu-latest
    needs: [full-unit-tests, minimal-unit-tests]
    if: ${{ always() && (needs.full-unit-tests.result == 'success' || needs.minimal-unit-tests.result == 'success') }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build documentation
      run: |
        python docs/serve.py --build-only --out site
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: book-html
        path: site
