# This workflow runs a full test suite on the LoQS package

name: LoQS Tests + Docs

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  workflow_dispatch: # Allow manual running from GitHub

jobs:
  check-pr-status:
    # Only meaningful for push events on non-main branches -- this is what
    # minimal-unit-tests below needs to decide whether to skip itself, since
    # a push to a branch with an open, non-draft PR against main will also
    # trigger full-unit-tests (via the pull_request event) for the same
    # commit, making the minimal run redundant.
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has-open-pr: ${{ steps.check.outputs.has-open-pr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the lookup itself fails for any reason (API hiccup, rate
          # limit, etc.), default to "no open PR" so minimal-unit-tests
          # still runs -- failing toward more coverage, not less.
          COUNT=$(gh pr list --repo "${{ github.repository }}" \
                    --head "${{ github.ref_name }}" \
                    --base main \
                    --state open \
                    --json isDraft \
                    --jq '[.[] | select(.isDraft == false)] | length') || COUNT=0
          echo "has-open-pr=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  minimal-unit-tests:
    needs: check-pr-status
    # Run only on feature branches, and only if there isn't already an open,
    # non-draft PR against main that will run the full matrix for this same
    # commit via the pull_request event (see check-pr-status above).
    if: >
      ${{
        github.event_name == 'push' &&
        github.ref != 'refs/heads/main' &&
        needs.check-pr-status.outputs.has-open-pr != 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # No Mac for speed
        python-version: ['3.12'] # stim 1.15 only has 3.12 Windows wheels, pymatching 2.3.1 only has 3.13 Windows wheels
        loqs-optional: ["all"]
    uses: ./.github/workflows/reusable-loqs.yml
    name: Run minimal LoQS tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      loqs-optional: ${{ matrix.loqs-optional }}
    
  full-unit-tests:
     # Run only on non-draft PRs or pushes into main
    if: >
      ${{
        (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        loqs-optional: ["all", "test"] #Test is no backends/parallel for minimal install testing
    uses: ./.github/workflows/reusable-loqs.yml
    name: Run complete LoQS tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      loqs-optional: ${{ matrix.loqs-optional }}
  
  notebook-tests:
    # Executes every tutorial notebook under docs/notebooks/*.md so that
    # API drift in a tutorial's own example code (as opposed to the
    # library's unit tests) gets caught before merge instead of shipping
    # silently. Same gate as full-unit-tests: non-draft PRs into main, or
    # pushes to main.
    if: >
      ${{
        (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # No loqs-optional dimension (unlike full-unit-tests): the
        # notebooks exercise optional backends directly, so only the
        # "all" install makes sense here.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install loqs[all]
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[all]"

    - name: Execute notebooks
      run: python docs/run_notebooks.py --output-dir notebook-output

    - name: Upload executed notebooks (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: notebook-outputs-${{ matrix.os }}-${{ matrix.python-version }}
        path: notebook-output

  # This is just so we can have a check for ALL matrix tests passing on PRs
  all-tests-passed:
    runs-on: ubuntu-latest
    needs: [full-unit-tests, notebook-tests]
    if: >
      ${{
        (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    steps:
      - name: Check matrix results
        run: |
          full="${{ needs.full-unit-tests.result }}"
          notebooks="${{ needs.notebook-tests.result }}"
          if [ "$full" == "success" ] && [ "$notebooks" == "success" ]; then exit 0; else exit 1; fi
  
  # Build docs if either minimal or full unit tests ran and succeeded
  docs:
    runs-on: ubuntu-latest
    needs: [full-unit-tests, minimal-unit-tests]
    if: ${{ always() && (needs.full-unit-tests.result == 'success' || needs.minimal-unit-tests.result == 'success') }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build documentation
      run: |
        python docs/serve.py --build-only --out site
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: book-html
        path: site
